# Resume variant registry, the single source of truth.
# packages/resume.nix, packages/checks.nix, and .github/workflows/_build.yml
# all read from this file. To add a new variant, add a section here and
# create the corresponding .typ file (and optional override TOML).
#
# Fields:
#   source          stem of the .typ file in resumes/ (required)
#   dest            output filename stem (without extension) for built artifacts and pages deploy (required)
#   expected_pages  exact page count for the PDF check; 0 = multi-page (>= 1) (required)
#   check_metadata  whether the variant's merged metadata is checked for completeness (required)
#   card_profile    shared business card: performance, technology, work, or none (required)
#                   supporting documents/letters use none; never emit per-variant cards
#   override_toml   override TOML filename in metadata/ (optional; omit for base-only variants)
#   title           display title on /resumes/ (required unless site_hidden; the site build fails without it)
#   field           group heading on /resumes/ (required unless site_hidden). The cv's field is listed
#                   first, then the rest in the order they first appear in this file.
#   subtitle        detail line under the title (optional; leave it off when it would repeat the field)
#   site_hidden     unlist from /resumes/ (optional; defaults to false). The PDF still ships at
#                   /resumes/<dest>.pdf, so a direct link keeps working. Use it for every
#                   employer-tailored resume and every cover letter.

[cv]
card_profile = "performance"
source = "cv"
dest = "resume"
expected_pages = 1
check_metadata = true
title = "Artistic Resume"
field = "Theatre & performance"

[tech]
card_profile = "technology"
source = "tech"
dest = "tech-resume"
override_toml = "tech-metadata.toml"
expected_pages = 2
check_metadata = true
title = "Technical Resume"
field = "Technology & IT"

