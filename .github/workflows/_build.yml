name: Build PDFs
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      export_pdfs:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [resume, finn-rutis]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@v35
      - name: Build ${{ matrix.package }}
        run: nix build '.#packages.x86_64-linux.${{ matrix.package }}' --print-build-logs
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.package }}
          path: ./result/
          if-no-files-found: error

  export:
    name: export release PDFs
    if: ${{ inputs.export_pdfs }}
    needs: build-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: |
            variants.toml
          sparse-checkout-cone-mode: false
      - name: Download resume PDFs
        uses: actions/download-artifact@v8
        with:
          name: resume
          path: ./artifacts/resume
      - name: Download composite PDF
        uses: actions/download-artifact@v8
        with:
          name: finn-rutis
          path: ./artifacts/finn-rutis
      - name: Export complete flat release PDF set
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import shutil
          import tomllib

          variants = tomllib.loads(pathlib.Path('variants.toml').read_text())
          if not variants:
              raise SystemExit('Variant registry is empty')
          sources = {}
          for variant in variants.values():
              dest = variant['dest']
              if not isinstance(dest, str) or not re.fullmatch(r'[A-Za-z0-9_-]+', dest):
                  raise SystemExit(f'Unsafe variant destination: {dest!r}')
              name = f'{dest}.pdf'
              if name in sources:
                  raise SystemExit(f'Duplicate release destination: {name}')
              sources[name] = pathlib.Path('artifacts/resume') / name
          sources['FINN RUTIS.pdf'] = pathlib.Path('artifacts/finn-rutis/FINN RUTIS.pdf')
          for source in sources.values():
              if not source.is_file() or source.stat().st_size == 0:
                  raise SystemExit(f'Missing or empty required PDF: {source}')
          output = pathlib.Path('release-pdfs')
          output.mkdir()
          for name, source in sources.items():
              shutil.copyfile(source, output / name)
          print(f'Exported {len(sources)} required PDFs')
          PY
      - name: Upload release PDFs
        uses: actions/upload-artifact@v7
        with:
          name: release-pdfs
          path: ./release-pdfs/*.pdf
          if-no-files-found: error
